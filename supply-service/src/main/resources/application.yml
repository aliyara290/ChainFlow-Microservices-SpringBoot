server:
  port: 8081

spring:
  application:
    name: supply-service
  
  datasource:
#    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://supply-db:5432/supply_db}
#    username: ${SPRING_DATASOURCE_USERNAME:aliyara29}
#    password: ${SPRING_DATASOURCE_PASSWORD:Yara2001}
    url: jdbc:postgresql://localhost:5432/supply_db
    username: aliyara29
    password: Yara2001
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/supply-chain-system

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: ${spring.application.name}


logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.cloud.gateway.filter: DEBUG
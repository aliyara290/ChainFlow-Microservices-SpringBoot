server:
  port: 8084

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5435/auth_db
    username: aliyara29
    password: Yara2001
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: ${spring.application.name}

logging:
  level:
    root: INFO  # Default level for all packages
    com.aliyara.authservice: DEBUG  # Your application logs (detailed)
    org.springframework.security: INFO  # Spring Security (change to DEBUG if troubleshooting)
    org.hibernate.SQL: DEBUG  # Shows SQL queries
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
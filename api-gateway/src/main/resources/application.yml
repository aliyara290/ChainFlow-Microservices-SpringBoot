server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/supply-chain-system

  cloud:
    gateway:
      # Routes are configured programmatically in GatewayConfig.java for WebMVC Gateway
      # YAML configuration is not fully supported in spring-cloud-starter-gateway-server-webmvc
      routes: []
#        - id: customer-service
#          uri: lb://customer-service
#          predicates:
#            - Path=/customer/**
#          filters:
#            - TokenRelay
#            - StripPrefix=1
#
#        - id: production-service
#          uri: lb://production-service
#          predicates:
#            - Path=/production/**
#          filters:
#            - TokenRelay
#            - StripPrefix=1
#
#        - id: supply-service
#          uri: lb://SUPPLY-SERVICE
#          predicates:
#            - Path=/supply/**
#          filters:
#            - TokenRelay
#            - StripPrefix=1

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info,routes
  endpoint:
    gateway:
      enabled: true

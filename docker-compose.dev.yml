services:
  supply-db:
    image: postgres:15-alpine
    container_name: supply-db
    profiles: ["default"]
    environment:
      POSTGRES_DB: supply_db
      POSTGRES_USER: aliyara29
      POSTGRES_PASSWORD: Yara2001
    ports:
      - "5432:5432"
    volumes:
      - supply-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U supply_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  production-db:
    image: postgres:15-alpine
    container_name: production-db
    profiles: ["default"]
    environment:
      POSTGRES_DB: production_db
      POSTGRES_USER: aliyara29
      POSTGRES_PASSWORD: Yara2001
    ports:
      - "5433:5432"
    volumes:
      - production-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer-db:
    image: postgres:15-alpine
    container_name: customer-db
    profiles: ["default"]
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: aliyara29
      POSTGRES_PASSWORD: Yara2001
    ports:
      - "5434:5432"
    volumes:
      - customer-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    profiles: ["pg"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - microservices-network
    depends_on:
      - supply-db
      - production-db
      - customer-db

  sonar-db:
    image: postgres:15
    container_name: sonar-db
    profiles: ["sonar"]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    profiles: ["sonar"]
    depends_on:
      - sonar-db
    ports:
      - "9001:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - microservices-network

  jenkins:
    build:
      context: ./jenkins-docker
    container_name: jenkins
    user: root
    profiles: ["jenkins"]
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: on-failure
    environment:
      JAVA_OPTS: "-Xms1g -Xmx3g"
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  supply-data:
  production-data:
  customer-data:
  pgadmin-data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar-db-data:
  jenkins_home:

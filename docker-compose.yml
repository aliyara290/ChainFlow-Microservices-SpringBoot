  supply-db:
    image: postgres:15-alpine
    container_name: supply-db
    environment:
      POSTGRES_DB: supply_db
      POSTGRES_USER: aliyara29
      POSTGRES_PASSWORD: Yara2001
    ports:
      - "5432:5432"
    volumes:
      - supply-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U supply_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  production-db:
    image: postgres:15-alpine
    container_name: production-db
    environment:
      POSTGRES_DB: production_db
      POSTGRES_USER: aliyara29
      POSTGRES_PASSWORD: Yara2001
    ports:
      - "5433:5432"
    volumes:
      - production-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer-db:
    image: postgres:15-alpine
    container_name: customer-db
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: aliyara29
      POSTGRES_PASSWORD: Yara2001
    ports:
      - "5434:5432"
    volumes:
      - customer-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - microservices-network
    depends_on:
      - supply-db
      - production-db
      - customer-db

